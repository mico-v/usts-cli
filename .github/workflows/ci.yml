name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check
      - run: go test -race -shuffle=on -count=1 ./...
      - run: make vuln
      - run: make build

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o /tmp/usts ./cmd/usts

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # 打包内容单独校验：tsc 从不删除输出，残留的旧模块产物会被 files:["dist"] 一起发布
      - name: 校验发布产物
        run: |
          npm pack --dry-run
          if npm pack --dry-run 2>&1 | grep -qE "dist/(commands|lib)/"; then
            echo "::error::发布包里含已删除模块的陈旧产物，请检查 tools/prune-dist.mjs"
            exit 1
          fi
