name: Publish

# 发布入口：推送 v* tag 即发布（或到 Actions 页面手动触发用于补救）。
#
# 为什么用 OIDC（trusted publishing）而不是 NPM_TOKEN：
#   - 不需要在仓库里存长期写权限 token（token 一旦泄露即可发版，且要人工轮换）；
#   - 每次发布用的是短时、绑定本仓库 + 本工作流文件名的签名凭证；
#   - npm 会自动附带 provenance 证明（本仓库是 public，满足条件）。
# 前提：在 npmjs.com 上为 @mico-v/usts-cli 配置 Trusted Publisher，字段须与下面完全一致：
#   Organization or user = mico-v
#   Repository           = usts-cli
#   Workflow filename    = publish.yml
#   Environment name     = （留空）
#
# 发布前会自动跑 `npm run check`（见 package.json 的 prepublishOnly）。

on:
  push:
    tags:
      - 'v*'
  # 手动触发：用于首次发布或 tag 推送失败的补救
  workflow_dispatch:

# 最小权限：只有 publish job 需要 id-token: write
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 换 npm 短期凭证，必需
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # 发布流程刻意不启用依赖缓存（缓存被投毒会污染发布产物）

      # trusted publishing 需要 npm >= 11.5.1（Node 22 自带的 npm 10 不够）
      - name: 升级到支持 OIDC 的 npm
        run: |
          npm install -g npm@^11
          node --version
          npm --version

      - name: 校验 tag 与 package.json 版本一致
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "非 tag 触发（$GITHUB_REF），跳过版本校验"
            exit 0
          fi
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag v$tag_version 与 package.json 的 $pkg_version 不一致"
            exit 1
          fi
          echo "版本一致：$pkg_version"

      - run: npm ci

      # prepublishOnly 里已包含 typecheck/lint/test；provenance 由 OIDC 自动附加
      - run: npm publish
